# Test every push to main, then deploy it to the production machine through its self-hosted
# runner (label shoponline-prod, set up by scripts/windows/install-deploy-runner.ps1).
# No pull_request trigger: code from forks must never reach the production runner.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shoponline_app
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shoponline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHOPONLINE_TEST_DATABASE_URL: postgresql+psycopg://shoponline_app:ci-only@localhost:5432/shoponline_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: [self-hosted, shoponline-prod]
    environment: production
    steps:
      - name: Update production checkout
        shell: pwsh
        run: '& C:\shoponline\scripts\windows\update-production.ps1 -Commit $env:GITHUB_SHA'
