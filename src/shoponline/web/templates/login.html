{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="card login-card">
  <p class="login-brand">Shop online</p>
  <h1>Đăng nhập</h1>
  <form method="post" action="/login">
    <label class="field-block">Tên đăng nhập
      <input type="text" name="username" autofocus required autocomplete="username"></label>
    <label class="field-block">Mật khẩu
      <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="block">Đăng nhập</button>
  </form>
</div>
{% endblock %}
