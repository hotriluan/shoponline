[project]
name = "shoponline"
version = "0.1.0"
description = "Đơn sàn TMĐT từ file Excel tới file đơn hàng SAP và file gửi kế toán"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
robot = ["pywin32>=311; sys_platform == 'win32'"]

[project.scripts]
shoponline = "shoponline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoponline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.isort]
known-first-party = ["shoponline", "tests"]
